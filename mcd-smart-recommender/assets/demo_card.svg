<svg viewBox="0 0 400 520" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>麦麦智选方案卡演示</title>
  <desc>一份增肌午餐组合示例：含营养表、当期优惠与叠加后到手价</desc>
  <rect x="20" y="20" width="360" height="480" rx="16" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
  <rect x="20" y="20" width="360" height="58" rx="16" fill="#FAC775"/>
  <rect x="20" y="58" width="360" height="20" fill="#FFFFFF"/>
  <text x="40" y="48" font-family="sans-serif" font-size="20" font-weight="500" fill="#412402">麦麦智选</text>
  <text x="360" y="46" text-anchor="end" font-family="sans-serif" font-size="12" fill="#854F0B">增肌 · 午餐 · 上海人民广场</text>

  <text x="40" y="100" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">推荐组合（高蛋白）</text>
  <line x1="40" y1="112" x2="360" y2="112" stroke="#F1EFE8" stroke-width="1"/>

  <text x="40" y="138" font-family="sans-serif" font-size="13" fill="#2C2C2A">板烧鸡腿堡</text>
  <text x="360" y="138" text-anchor="end" font-family="sans-serif" font-size="12" fill="#5F5E5A">391kcal · 蛋白23g</text>
  <text x="40" y="162" font-family="sans-serif" font-size="13" fill="#2C2C2A">中薯条</text>
  <text x="360" y="162" text-anchor="end" font-family="sans-serif" font-size="12" fill="#5F5E5A">289kcal · 蛋白4g</text>
  <text x="40" y="186" font-family="sans-serif" font-size="13" fill="#2C2C2A">无糖可口可乐(中)</text>
  <text x="360" y="186" text-anchor="end" font-family="sans-serif" font-size="12" fill="#5F5E5A">0kcal · 蛋白0g</text>

  <line x1="40" y1="204" x2="360" y2="204" stroke="#F1EFE8" stroke-width="1"/>
  <text x="40" y="228" font-family="sans-serif" font-size="13" fill="#2C2C2A">合计营养</text>
  <text x="360" y="228" text-anchor="end" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">680kcal · 蛋白27g</text>

  <text x="40" y="262" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">当期可享优惠</text>
  <rect x="40" y="274" width="320" height="40" rx="8" fill="#EAF3DE"/>
  <text x="56" y="299" font-family="sans-serif" font-size="13" fill="#27500A">免费脆薯饼券（原价 ¥8.5）→ 替换中薯条</text>

  <rect x="40" y="334" width="320" height="64" rx="12" fill="#FBEAF0"/>
  <text x="56" y="362" font-family="sans-serif" font-size="13" fill="#72243E">原价 ¥46.5（calculate-price 实算）</text>
  <text x="56" y="386" font-family="sans-serif" font-size="18" font-weight="500" fill="#993556">到手价 ¥38.0 · 省 ¥8.5</text>

  <text x="40" y="430" font-family="sans-serif" font-size="12" fill="#5F5E5A">叠加来源：可领券 × 饮食引擎 × calculate-price</text>
  <text x="40" y="470" font-family="sans-serif" font-size="11" fill="#B4B2A9">* 仅供参考，非专业建议；餐品/价格以官方实时为准</text>
</svg>